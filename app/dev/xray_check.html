<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#04070f;overflow:hidden}</style>
<script type="importmap">{"imports":{"three":"../vendor/three/three.module.js","three/addons/":"../vendor/three/jsm/"}}</script></head><body>
<script type="module">
import * as THREE from 'three';

import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
const q = new URLSearchParams(location.search), sex = q.get('sex') || 'male', view = q.get('view') || 'front';

const BONES = ['skull','spine','ribcage','shoulders','pelvis','limbs'];

const lit = focus ? ZONE[focus] || [focus] : null;
const bodyFile = sex === 'male' ? 'human.glb' : 'human_female.glb';
const [body, anat] = await Promise.all([L.loadAsync('../assets/body3d/' + bodyFile), L.loadAsync((q.get('adir') || '../assets/body3d/') + `anatomy_${sex}.glb`)]);
body.scene.traverse(o => { if (o.isMesh) { o.material = fres(mode === 'radiograph' ? '#9fb9d6' : '#4f9dff', 2.0, 0.02, 0.35, true); o.renderOrder = 10; } });

  const bone = BONES.includes(g);

const zoom = q.get('zoom'); const d = q.get('d') ? h * parseFloat(q.get('d')) : zoom ? h * 0.9 : h * 2.75;   // d, cy, cx: distance, height and side offset as fractions of stature
const ty = q.get('cy') ? box.min.y + h * parseFloat(q.get('cy')) : zoom === 'chest' ? box.min.y + h * 0.72 : zoom === 'head' ? box.min.y + h * 0.92 : c.y;

if (q.get('cz')) c.z += h * parseFloat(q.get('cz'));

  for (let i = 0; i < P.count; i++) { v.fromBufferAttribute(P, i);

document.title = 'READY ' + names.length + ' ' + names.join(',');
